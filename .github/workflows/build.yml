name: Build

on:
  push:
    branches: [main]
    tags: ['v*']        # tag push builds the tagged commit so git describe
                        # bakes the release codename into REASIXTY_VERSION_NAME;
                        # the .so/.dll artifacts feed the release (no Linux/Win box)
  pull_request:
    branches: [main]
  workflow_dispatch:

# Compile-check on all three target platforms so a green PR means "builds
# everywhere" without firing up a Windows or Linux box. Runtime testing against
# the SSL UF8/UC1 hardware still needs a machine with the device attached.
#
# reaper-sdk + WDL are pulled by the project's own FetchContent. libusb/hidapi:
# pkg-config on Unix (apt/brew), prebuilt MSVC drops on Windows.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Only the Linux entry sets `container`; everywhere else this expression is
    # empty, which the runner treats as "no container" and the job runs on the
    # host image as before.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built inside ubuntu:22.04, NOT on ubuntu-latest. The shipped .so
          # must load on the OLDEST distro we support, and an ELF hard-codes
          # the symbol versions of the machine that linked it: ubuntu-latest
          # (24.04, glibc 2.39 / GCC 13) stamps GLIBC_2.38 + GLIBCXX_3.4.31
          # into the binary, and REAPER's dlopen then fails on anything older
          # — v0.4.4 was unloadable on MX Linux 23 and Debian 12 (glibc 2.36).
          # 22.04's glibc 2.35 is below every currently supported distro, so
          # its binaries load everywhere. libstdc++ is linked statically on
          # top (extension/CMakeLists.txt), and dist/check-linux-abi.py fails
          # the packaging step if this ever regresses.
          #
          # The container also pins the bundled libusb / hidapi: they are
          # copied out of this image and carry its glibc floor too — the
          # v0.4.4 libusb-1.0.so.0 needed GLIBC_2.38 for exactly that reason.
          - name: linux-x86_64
            os: ubuntu-latest
            container: ubuntu:22.04
            artifact: reaper_rea-sixty.so
            artifact_path: extension/build/reaper_rea-sixty.so
          - name: macos-arm64
            os: macos-latest
            artifact: reaper_rea-sixty.dylib
            artifact_path: extension/build/reaper_rea-sixty.dylib
          # Intel macOS: macos-13 was deprecated (fully removed Dec 2025), which
          # left this job stuck queued forever. macos-15-intel is the current —
          # and last — x86_64 GitHub runner (supported until Aug 2027). A plain
          # build there yields an x86_64 dylib + x86_64 Homebrew deps for the
          # darwin-x86_64 ReaPack package, so Intel-Mac users get updates via
          # ReaPack instead of building from source.
          - name: macos-x86_64
            os: macos-15-intel
            artifact: reaper_rea-sixty-x86_64.dylib
            artifact_path: extension/build/reaper_rea-sixty.dylib
          - name: windows-x64
            os: windows-latest
            artifact: reaper_rea-sixty.dll
            artifact_path: extension/build/Release/reaper_rea-sixty.dll

    steps:
      # Runs BEFORE checkout on purpose: the ubuntu:22.04 image is bare, and
      # without git installed actions/checkout falls back to downloading a
      # tarball — no .git, so `git describe --tags` finds no tag and the
      # release codename never reaches REASIXTY_VERSION_NAME. Everything the
      # build needs is installed here (no sudo: we are root in the container).
      # binutils supplies the readelf that the CMake bundling step uses to read
      # the SONAME of libusb / hidapi; python3 runs the ABI guard below.
      - name: Bootstrap container (Linux)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates pkg-config binutils \
            python3-minimal libusb-1.0-0-dev libhidapi-dev
          # The workspace belongs to the runner user, the container is root:
          # without this git refuses to touch it ("dubious ownership").
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe --tags drives version + codename

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb hidapi pkg-config

      - name: Fetch libusb + hidapi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -L -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z
          7z x libusb.7z -o"${{ github.workspace }}/libusb"
          curl.exe -L -o hidapi.zip https://github.com/libusb/hidapi/releases/download/hidapi-0.15.0/hidapi-win.zip
          Expand-Archive -Path hidapi.zip -DestinationPath "${{ github.workspace }}/hidapi"

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S extension -B extension/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S extension -B extension/build
          -DLIBUSB_ROOT="${{ github.workspace }}/libusb"
          -DHIDAPI_ROOT="${{ github.workspace }}/hidapi"

      - name: Build
        run: cmake --build extension/build --config Release --parallel

      # Fail here rather than in a user's REAPER. Checks the symbol versions
      # the .so and the two bundled libs demand of the system, against the
      # oldest distro we support. Catches a bumped container image, a dropped
      # -static-libstdc++, or a bundled lib picked up from the wrong place.
      - name: Verify ABI floor (Linux)
        if: matrix.container != ''
        run: |
          python3 dist/check-linux-abi.py \
            extension/build/reaper_rea-sixty.so \
            extension/build/libusb-1.0.so.* \
            extension/build/libhidapi-*.so.*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      # The Intel-Mac ReaPack package also needs the x86_64 libusb / hidapi
      # the build bundled into extension/build/. The arm64 release picks these
      # up locally on Frank's Mac; the x86_64 ones only exist on the CI runner,
      # so ship them as a separate artifact the release runbook downloads.
      - name: Upload macOS x86_64 bundled libs
        if: matrix.name == 'macos-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-libs
          path: |
            extension/build/libusb-1.0.0.dylib
            extension/build/libhidapi.0.dylib
          if-no-files-found: error

      # Same idea on Linux: the CMake POST_BUILD ("Linux libusb / hidapi
      # bundling") drops the system libusb / hidapi next to the .so under
      # their SONAME. They only exist on the CI runner, so ship them as a
      # separate artifact the release runbook downloads into extension/build/
      # before running dist/release-linux.sh. Globs so the SONAME version
      # (libusb-1.0.so.0, libhidapi-hidraw.so.0) is picked up automatically.
      - name: Upload Linux bundled libs
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-libs
          path: |
            extension/build/libusb-1.0.so.*
            extension/build/libhidapi-*.so.*
          if-no-files-found: error
