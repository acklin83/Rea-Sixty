name: ORC Windows

on:
  push:
    branches: [main, 'claude/orc-windows-*']
  workflow_dispatch:

# ORC under Windows (docs/orc-windows-plan.md, section 14): the program, its tests,
# the installer. Its own workflow, so a red ORC does not hold up the extension's DLL
# and a run here does not wait for the Mac runners.

jobs:
  orc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch libusb + hidapi
        shell: pwsh
        run: |
          curl.exe -L -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z
          7z x libusb.7z -o"${{ github.workspace }}/libusb"
          curl.exe -L -o hidapi.zip https://github.com/libusb/hidapi/releases/download/hidapi-0.15.0/hidapi-win.zip
          Expand-Archive -Path hidapi.zip -DestinationPath "${{ github.workspace }}/hidapi"

      - name: Configure
        run: >
          cmake -S extension -B extension/build -DORC_WINDOWS=ON
          -DLIBUSB_ROOT="${{ github.workspace }}/libusb"
          -DHIDAPI_ROOT="${{ github.workspace }}/hidapi"

      - name: Build
        run: cmake --build extension/build --config Release --target orc_windows_all --parallel

      # ⛔ Ports from the system and scratch folders only; nothing opens a device.
      - name: Test
        run: ctest --test-dir extension/build -C Release --output-on-failure --timeout 180 -R "^(orc_(keys|handover|phones|websocket|phones_server|settings)|rme_(osc|input|softkeys|face))$"

      - name: Upload ORC
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: orc-windows
          path: |
            extension/build/Release/ORC.exe
            extension/build/Release/libusb-1.0.dll
            extension/build/Release/moreme/
            extension/build/Release/settings/
          if-no-files-found: error
