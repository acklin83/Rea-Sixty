# Deployed to /opt/reasixty/ on the Hostinger VPS (srv1401714.hstgr.cloud).
# Caddy runs on the HOST, not in Docker, so a new service here is a container
# publishing to loopback plus a reverse_proxy block in /etc/caddy/Caddyfile —
# never a docker-network attach. See docs/deploy-exchange.md.

services:
  exchange:
    build: .
    restart: unless-stopped
    ports:
      # Loopback only. The host Caddy is the single public listener; this is
      # the pattern the newer services on the box follow (ddl-website:3100,
      # listmonk), unlike the older ones that still expose 0.0.0.0.
      - "127.0.0.1:8010:8010"
    environment:
      NODE_ENV: production
      # 0.0.0.0 INSIDE the container. The loopback restriction is the port
      # publish above — binding 127.0.0.1 in here would make the service
      # unreachable from the host, which is the classic way to lose an hour.
      HOST: 0.0.0.0
      PORT: 8010
      DATA_DIR: /data
    volumes:
      # The only state: exchange.db plus the uploaded .rea60map blobs. `var/`
      # is the same name the repo uses for it locally. Must be owned by uid
      # 1000 on the host — the image runs as the unprivileged `node` user.
      - ./var:/data
    healthcheck:
      # No curl or wget in node:slim, so ask Node itself.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
